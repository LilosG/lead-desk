name: Lead Desk Quality

on:
  push:
    branches:
      - main
      - 'recovery/**'
      - 'feature/**'
      - 'fix/**'
  pull_request:

permissions:
  contents: read

jobs:
  backend-unit-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://lead_desk_test:lead_desk_test@127.0.0.1:5432/lead_desk_test
      AUTH_USERNAME: test-admin
      AUTH_PASSWORD_HASH: pbkdf2_sha256$310000$00112233445566778899aabbccddeeff$1d7a56e972778af89f9f8abc8e4c42c0ed40bed87dd763588530de45f7087d82
      AUTH_SESSION_SECRET: test-session-secret-that-is-longer-than-thirty-two-characters
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile all Python
        run: python -m compileall -q app pipeline sql tests

      - name: Run integration unit tests
        run: |
          pytest -q \
            tests/app/test_integrations.py \
            tests/app/test_outreach_integrations.py \
            tests/app/test_outreach_slot_repair.py \
            tests/app/test_outreach_grounding.py \
            tests/app/test_outreach_similarity.py \
            tests/app/test_outreach_constrained.py \
            tests/app/test_openrouter_structured.py \
            tests/app/test_outreach_blocked_generation.py \
            tests/app/test_audit_reports.py \
            tests/app/test_demo_sites.py \
            tests/app/test_demo_sites_v3.py \
            tests/app/test_demo_media.py \
            tests/app/test_sweep_request_validation.py \
            tests/app/test_dynamic_sweep_cities.py \
            tests/app/test_market_inventory_contract.py

      - name: Run deterministic pipeline regressions
        run: |
          python pipeline/test_scoring.py
          python pipeline/test_vertical_filter.py
          python pipeline/test_paging_contract.py
          python pipeline/test_run_lifecycle.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Dependency security audit
        run: |
          npm audit --json > npm-audit.json || true
          node scripts/verify-audit.mjs npm-audit.json

      - name: Astro validation
        run: npm run check

      - name: Production build
        run: npm run build
