name: Lead Desk Quality

on:
  push:
    branches:
      - main
      - 'recovery/**'
      - 'feature/**'
      - 'fix/**'
  pull_request:

permissions:
  contents: read

jobs:
  backend-unit-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lead_desk_test
          POSTGRES_PASSWORD: lead_desk_test
          POSTGRES_DB: lead_desk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lead_desk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://lead_desk_test:lead_desk_test@127.0.0.1:5432/lead_desk_test
      AUTH_USERNAME: test-admin
      AUTH_PASSWORD_HASH: pbkdf2_sha256$310000$00112233445566778899aabbccddeeff$1d7a56e972778af89f9f8abc8e4c42c0ed40bed87dd763588530de45f7087d82
      AUTH_SESSION_SECRET: test-session-secret-that-is-longer-than-thirty-two-characters
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile all Python
        run: python -m compileall -q app pipeline sql tests

      - name: Build test database (schema, migrations, production views)
        run: scripts/build_test_db.sh

      # The whole suite runs now. Hand-picking files let excluded tests rot
      # against code that had moved on.
      - name: Run backend tests
        run: pytest -q tests

      - name: Run deterministic pipeline regressions
        run: |
          python pipeline/test_scoring.py
          python pipeline/test_vertical_filter.py
          python pipeline/test_paging_contract.py
          python pipeline/test_run_lifecycle.py
          python pipeline/test_market_scope.py
          python pipeline/test_crawl_niche.py
          python pipeline/test_site_signals.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Dependency security audit
        run: |
          npm audit --json > npm-audit.json || true
          node scripts/verify-audit.mjs npm-audit.json

      - name: Astro validation
        run: npm run check

      - name: Production build
        run: npm run build
